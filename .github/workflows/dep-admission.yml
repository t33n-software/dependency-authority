name: dep-admission lane

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module path of the candidate (for example github.com/google/go-cmp)."
        required: true
        type: string
      version:
        description: "Version of the candidate (for example v0.7.0)."
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: dep-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    name: Admission
    environment: dep-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Authenticate the admission controller identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEP_ADMISSION_WIF_PROVIDER }}
          service_account: ${{ vars.DEP_ADMISSION_CONTROLLER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Build the admission controller
        run: go build -mod=readonly -trimpath -o .build/dependency-admission-controller ./cmd/dependency-admission-controller

      - name: Run the admission lane
        env:
          DEPENDENCY_AUTHORITY_ZONE: control
          DEPENDENCY_AUTHORITY_ECOSYSTEM: go
          DEPENDENCY_AUTHORITY_ARTIFACT_API: https://artifactregistry.googleapis.com
          DEPENDENCY_AUTHORITY_EVIDENCE_REPOSITORY: ${{ vars.DEP_EVIDENCE_REPOSITORY }}
          DEPENDENCY_AUTHORITY_POLICY_BUNDLE: .build/policy/go.json
          DEPENDENCY_AUTHORITY_SCANNER_TOOL: .build/osv-scanner
          DEPENDENCY_AUTHORITY_SCANNER_DATABASE: .build/osv-db
          DEPENDENCY_AUTHORITY_SCAN_CONTENT_ROOT: .build/content
          DEPENDENCY_AUTHORITY_MODULE: ${{ inputs.module }}
          DEPENDENCY_AUTHORITY_VERSION: ${{ inputs.version }}
          DEPENDENCY_AUTHORITY_LANE_IDENTITY: ${{ vars.DEP_ADMISSION_CONTROLLER_SERVICE_ACCOUNT }}
          DEPENDENCY_AUTHORITY_SCANNER_IDENTITY: ${{ vars.DEP_SCANNER_IDENTITY }}
          DEPENDENCY_AUTHORITY_SCANNER_DATABASE_IDENTITY: ${{ vars.DEP_SCANNER_DATABASE_IDENTITY }}
          DEPENDENCY_AUTHORITY_APPROVAL_TTL: "72h"
          DEPENDENCY_AUTHORITY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: ./.build/dependency-admission-controller
