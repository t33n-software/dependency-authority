name: CI

on:
  push:
    branches: [main, develop, "release/**", "support/**"]
  pull_request:
    branches: [main, develop, "release/**", "support/**"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality gates
    permissions:
      contents: read
    uses: t33n-software/repository-governance/.github/workflows/reusable-ci-go.yml@397b6d987a624f176eb234829ae045cf4022f3e4
    with:
      quality_class: linux-only
