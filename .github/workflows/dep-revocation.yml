name: dep-revocation lane

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: dep-revocation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revocation:
    name: Revocation
    environment: dep-revocation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Authenticate the revocation controller identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEP_REVOCATION_WIF_PROVIDER }}
          service_account: ${{ vars.DEP_REVOCATION_CONTROLLER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Build the revocation controller
        run: go build -mod=readonly -trimpath -o .build/dependency-revocation-controller ./cmd/dependency-revocation-controller

      - name: Run the revocation lane binding
        env:
          DEPENDENCY_AUTHORITY_ZONE: control
          DEPENDENCY_AUTHORITY_ECOSYSTEM: go
          DEPENDENCY_AUTHORITY_ARTIFACT_API: https://artifactregistry.googleapis.com
          DEPENDENCY_AUTHORITY_EVIDENCE_REPOSITORY: ${{ vars.DEP_EVIDENCE_REPOSITORY }}
          DEPENDENCY_AUTHORITY_APPROVED_REPOSITORY: ${{ vars.DEP_APPROVED_REPOSITORY }}
          DEPENDENCY_AUTHORITY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: ./.build/dependency-revocation-controller
