name: dep-evidence-write lane

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: dep-evidence-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence-write:
    name: Evidence write
    environment: dep-evidence-write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate the evidence writer identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEP_EVIDENCE_WRITE_WIF_PROVIDER }}
          service_account: ${{ vars.DEP_EVIDENCE_WRITER_SERVICE_ACCOUNT }}

      - name: Write the lane run evidence marker
        env:
          EVIDENCE_REPOSITORY: ${{ vars.DEP_EVIDENCE_REPOSITORY }}
          RUN_DOCUMENT: .build/lane-run.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_REPOSITORY"
          mkdir -p .build
          IFS='/' read -ra SEGMENTS <<< "$EVIDENCE_REPOSITORY"
          PROJECT="${SEGMENTS[1]}"
          LOCATION="${SEGMENTS[3]}"
          REPOSITORY="${SEGMENTS[5]}"
          test -n "$PROJECT"
          test -n "$LOCATION"
          test -n "$REPOSITORY"
          printf '{"schema":"dependency-authority/lane-run/v1","environment":"dep-evidence-write","repository":"%s","ref":"%s","run_id":"%s","run_attempt":"%s","actor":"%s","recorded_at":"%s"}\n' \
            "${{ github.repository }}" \
            "${{ github.ref }}" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            "${{ github.actor }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUN_DOCUMENT"
          gcloud artifacts generic upload \
            --project="$PROJECT" \
            --location="$LOCATION" \
            --repository="$REPOSITORY" \
            --package=lane-runs \
            --version=v1 \
            --source="$RUN_DOCUMENT" \
            --destination-path="dep-evidence-write/${{ github.run_id }}-${{ github.run_attempt }}.json"
