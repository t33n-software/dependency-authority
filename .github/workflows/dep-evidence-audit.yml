name: dep-evidence-audit lane

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: dep-evidence-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence-audit:
    name: Evidence audit
    environment: dep-evidence-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate the evidence auditor identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEP_EVIDENCE_AUDIT_WIF_PROVIDER }}
          service_account: ${{ vars.DEP_EVIDENCE_AUDITOR_SERVICE_ACCOUNT }}

      - name: Read the evidence index surface
        env:
          EVIDENCE_REPOSITORY: ${{ vars.DEP_EVIDENCE_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_REPOSITORY"
          IFS='/' read -ra SEGMENTS <<< "$EVIDENCE_REPOSITORY"
          PROJECT="${SEGMENTS[1]}"
          LOCATION="${SEGMENTS[3]}"
          REPOSITORY="${SEGMENTS[5]}"
          test -n "$PROJECT"
          test -n "$LOCATION"
          test -n "$REPOSITORY"
          gcloud artifacts files list \
            --project="$PROJECT" \
            --location="$LOCATION" \
            --repository="$REPOSITORY"
